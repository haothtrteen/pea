name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # core-only：不装可选依赖组。MCP SDK 缺失必须是**显式 skip 不是 fail**——
  # 核心包零运行时依赖是合同的一部分，靠这个 job 守住。
  core-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy

      - name: Test (core only — the SDK is absent on purpose)
        run: pytest -q

      - name: Contract gate (schemas are the source of truth)
        run: pytest tests/test_contracts.py -q

  # full-integration：装可选组跑真实协议面。SDK 检测收紧到具体符号
  # （mcp.types / ClientSession / stdio_client），namespace 占位包骗不过——
  # 缺真 SDK 时是 skip，装上了就必须真跑。
  full-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (with the optional MCP extra)
        run: pip install -e ".[dev,mcp]"

      - name: Protocol suite (real SDK, real subprocess)
        run: pytest tests/test_mcpstdio.py tests/test_toolschemas.py -q

      - name: CLI protection loop smoke (no tool install; refuses cleanly offline)
        run: |
          pea catalog
          pea protect --help
          pea approve --store /tmp/pea-approvals

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: pea catalog
        run: pea catalog
      - name: pea search
        run: pea search --target javascript --goal obfuscation
      - name: pea plan
        run: pea plan --request examples/protection-request.example.json --out /tmp/pea-plan.json
