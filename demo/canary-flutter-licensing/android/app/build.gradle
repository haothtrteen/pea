plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.example.flutter_licensing'
  compileSdk 34
  defaultConfig {
    applicationId 'com.example.flutter_licensing'
    minSdk 24
    targetSdk 34
    ndk {
      // Declared ABIs: the L2 artifact layer emits one synthetic
      // libapp.so per declared ABI, and build-integration asserts
      // declared == shipped.
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
    }
  }
  buildTypes {
    release {
      // NOTE: R8 here only touches the Java/Kotlin host layer.
      // It does NOT touch the Dart AOT snapshot (libapp.so) - that
      // distinction is the whole point of the demo scenario.
      minifyEnabled true
    }
  }
}
