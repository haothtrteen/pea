[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pea"
version = "0.7.0"
description = "PEA — Protection Engineering Assistant: offline, evidence-driven protection planning for software you own or are authorized to test."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PEA Project contributors" }]
keywords = ["software-protection", "reverse-engineering", "exposure-mapping", "mcp", "security-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Runtime dependencies are intentionally empty: the prototype runs on the
# standard library only so it stays usable offline. Third-party packages are
# confined to the optional dev/contract groups below.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jsonschema>=4.20",
    "referencing>=0.31",
    "ruff>=0.4",
    "mypy>=1.8",
]
contracts = [
    "jsonschema>=4.20",
    "referencing>=0.31",
]
# The MCP stdio server (``pea mcp-server``) speaks JSON-RPC through the
# official SDK. It stays optional for the same reason as ``contracts``: the
# core package must remain importable and testable offline without it, and
# only the protocol entry point consumes the SDK. The constraint tracks the
# v2 low-level API (add_request_handler / snake_case model fields) that
# pea.mcpstdio registers against.
mcp = [
    "mcp>=2.0",
]

[project.scripts]
pea = "pea.cli:main"

# Declared now that the project has its own public repository. (Earlier values
# pointed at REA, a read-only upstream reference, and misled installers - that
# is why this block was commented out until the real location existed.)
[project.urls]
Homepage = "https://github.com/haothtrteen/pea"
Repository = "https://github.com/haothtrteen/pea"
Issues = "https://github.com/haothtrteen/pea/issues"
Changelog = "https://github.com/haothtrteen/pea/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pea = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:pea.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W"]
ignore = [
    "E501",  # long lines are handled by the formatter, not the linter
    # RUF001/RUF002/RUF003 flag full-width CJK punctuation (，；) as "ambiguous".
    # PEA's user-facing strings are Chinese, so this rule is a false positive here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are expected in tests

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["pea"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

# The official MCP SDK is an *optional* dependency: the core package must
# import without it (that is part of the contract). The CI core-only job runs
# mypy in an environment where `mcp` is deliberately absent, so the missing
# stub is expected - a property of the environment, not a defect in the code.
# With the extra installed (full-integration job) these imports are still
# type-checked against the real SDK, unchanged.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true
